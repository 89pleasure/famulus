# Publishes the website (the folder website/, served as it is, no build step) on GitHub Pages
# whenever a push to main changes it, and after every release uploaded to CurseForge, so that the
# page names the new release. Commits that only touch the addon do not trigger it.
#
# Once per repository: Settings > Pages > Build and deployment > Source "GitHub Actions".
# The custom domain is set there too (Settings > Pages > Custom domain); with this workflow no
# CNAME file is needed. Run by hand (Actions > Website > Run workflow) to publish without a change.
name: Website

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  # After a release rather than on its tag: the github-pages environment lets only main deploy,
  # and a workflow_run always runs on main.
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs as in GitHub's own Pages workflow: in a single job, deploy-pages sometimes looked for the
# artifact before GitHub listed it ("Found 0 artifact(s)", 2026-11-25, twice), and a re-run then
# uploaded a second one ("Multiple artifacts"). Re-run the whole workflow, not only the failed job.
jobs:
  build:
    # After a release only if it succeeded and uploaded (a tag push, not a dry run by hand).
    # deploy needs build, so it is skipped along with it.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      # The full history, so that the tags are there.
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that Pages is set up
        uses: actions/configure-pages@v6

      # Notes for AI assistants live next to the site's code but are not part of the site.
      - name: Leave out CLAUDE.md
        run: rm -f website/CLAUDE.md

      # The texts name the version as "Version <x>" (fact_version and in_rel_d in index.html and
      # in every language file but en.js, the footer in index.html and legal.html; Spanish
      # writes "Versión <x>", Italian "Versione <x>");
      # the newest release tag replaces it, so the page never lags behind a release. Newest by
      # version, wherever the tag sits: v0.1.0-alpha.4 was set on the branch of its pull request
      # instead of the squash merge on main, and git describe on main still found alpha.3.
      # versionsort.suffix=- puts v1.2.3-alpha.1 and v1.2.3-beta.1 before v1.2.3.
      - name: Name the current release
        run: |
          version=$(git -c versionsort.suffix=- tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$' | head -n 1)
          [ -n "$version" ] || { echo "::error::There is no release tag."; exit 1; }
          version=${version#v}
          sed -E -i "s/(Version|Versión|Versione) [0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?/\1 $version/g" website/index.html website/legal.html website/i18n/*.js
          for file in website/index.html website/legal.html website/i18n/*.js; do
            [ "$file" = website/i18n/en.js ] && continue # English stands in index.html
            grep -Eq "(Version|Versión|Versione) $version" "$file" || { echo "::error::$file does not name Version $version."; exit 1; }
          done
          echo "Version $version"

      - name: Pack the website
        uses: actions/upload-pages-artifact@v5
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
